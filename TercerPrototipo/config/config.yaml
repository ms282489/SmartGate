# Este archivo contiene valores que pueden cambiar entre instalaciones.
# No contiene la logica del programa ni el estado actual del porton.


#Configuracion de la camara
camera:
  # Picamera2 usa libcamera para la Arducam OV5647 conectada por CSI.
  backend: "picamera2"

  # Cero representa la primera camara detectada por libcamera.
  index: 0

  # 1280x960 mantiene la relacion 4:3 del sensor de 5 MP y evita el
  # costo de procesar los 2592x1944 pixeles completos en cada cuadro.
  width: 1280
  height: 960

  # Una frecuencia moderada deja CPU disponible para los tres modelos.
  fps: 20

  # Tiempo para estabilizar exposicion y balance de blancos al iniciar.
  warmup_seconds: 2.0

  # Vista local en el escritorio de Raspberry Pi OS. El pipeline continúa
  # funcionando si no hay pantalla o no existe una sesión gráfica.
  preview:
    enabled: true
    window_name: "SmartGate"
    width: 960
    height: 720
    wait_key_ms: 30

thresholds:
  # Configuracion de puntajes minimos para ser aprovados por cada modelo, esto se utiliza para ir 
  detection: 0.85
  antispoof: 0.99
  recognition: 0.50


# Ritmo del detector YuNet. El reconocimiento y el antispoofing siguen usando
# el cuadro original de 1280x960; solo la búsqueda inicial usa una copia más
# pequeña y luego escala la caja y los landmarks a la resolución completa.
detection:
  inference_width: 640
  inference_height: 480

  # Mientras una persona se acerca, buscar en cada cuadro para responder sin
  # una espera perceptible. Cero significa sin pausa artificial adicional.
  active_scan_interval_seconds: 0.0

  # Si no aparece ninguna cara durante 5 segundos, pasar a IDLE y ejecutar
  # YuNet cinco veces por segundo. Una cara encontrada se procesa en ese mismo
  # cuadro, por lo que la demora máxima agregada es de aproximadamente 0.2 s.
  no_face_idle_seconds: 5.0
  idle_scan_interval_seconds: 0.2

  # Evita reconocer repetidamente a la misma persona. La pausa comienza al
  # volver a IDLE: tras mostrar el resultado o después de cerrar el portón.
  authorized_cooldown_seconds: 10.0

# Supabase se sincroniza en segundo plano. Ninguna de estas esperas
# detiene el pipeline de cámara cuando no hay Internet.
supabase:
  retry_seconds: 10
  gallery_refresh_seconds: 5
  face_sync_seconds: 60
  postgrest_timeout_seconds: 10
  storage_timeout_seconds: 15


# Configuracion GPIO
gpio:
  chip: "/dev/gpiochip0"

  # El final de carrera entrega HIGH únicamente cuando el portón está
  # completamente cerrado. LOW significa abierto, abriendo o cerrando.
  final_carrera_cerrado_activo_alto: true

  pins:
    final_carrera: 17
    led_activo: 18
    led_aceptado: 23
    led_rechazado: 24
    abrir_porton: 25

leds:
  frecuencia_procesando_hz: 2.0

gate:
  pulse_tiempo: 500

  # true permite probar detección, antispoofing y reconocimiento usando solo
  # la cámara. No utiliza el final de carrera ni activa abrir_porton.
  # Cambiar a false antes de conectar y operar el portón real.
  modo_solo_camara: false
  resultado_visible_segundos: 2.0

  # Configuración de telemetría serial
telemetry:
  port: "/dev/serial0"
  baudrate: 115200
  interval: 60
