# Este archivo contiene valores que pueden cambiar entre instalaciones.
# No contiene la logica del programa ni el estado actual del porton.


#Configuracion de la camara
camera:
  # Picamera2 usa libcamera para la Arducam OV5647 conectada por CSI.
  backend: "picamera2"

  # Cero representa la primera camara detectada por libcamera.
  index: 0

  # 1280x960 mantiene la relacion 4:3 del sensor de 5 MP y evita el
  # costo de procesar los 2592x1944 pixeles completos en cada cuadro.
  width: 1280
  height: 960

  # Una frecuencia moderada deja CPU disponible para los tres modelos.
  fps: 20

  # Tiempo para estabilizar exposicion y balance de blancos al iniciar.
  warmup_seconds: 2.0

  # Vista local en el escritorio de Raspberry Pi OS. El pipeline continúa
  # funcionando si no hay pantalla o no existe una sesión gráfica.
  preview:
    enabled: true
    window_name: "SmartGate"
    width: 960
    height: 720
    wait_key_ms: 30

thresholds:
  # Configuracion de puntajes minimos para ser aprovados por cada modelo, esto se utiliza para ir 
  detection: 0.85
  antispoof: 0.99
  recognition: 0.50


# Supabase se sincroniza en segundo plano. Ninguna de estas esperas
# detiene el pipeline de cámara cuando no hay Internet.
supabase:
  retry_seconds: 10
  gallery_refresh_seconds: 5
  face_sync_seconds: 60
  postgrest_timeout_seconds: 10
  storage_timeout_seconds: 15


# Configuracion GPIO
gpio:
  chip: "/dev/gpiochip0"

  pins:
    final_carrera: 17
    led_activo: 18
    led_aceptado: 23
    led_rechazado: 24
    abrir_porton: 25

leds:
  frecuencia_procesando_hz: 2.0

gate:
  pulse_tiempo: 500

  # true permite probar detección, antispoofing y reconocimiento usando solo
  # la cámara. No utiliza el final de carrera ni activa abrir_porton.
  # Cambiar a false antes de conectar y operar el portón real.
  modo_solo_camara: true
  resultado_visible_segundos: 2.0

  # Configuración de telemetría serial
telemetry:
  port: "/dev/serial0"
  baudrate: 115200
  interval: 60
